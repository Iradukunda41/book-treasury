<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Favorites | Book Treasury</title>

     <link rel="preconnect" href="https://fonts.googleapis.com" />
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

     <style type="text/tailwindcss">
          @theme {
      --color-brand: #0a3d1f;
      --color-accent: #b9700b;
      --font-sans: "Poppins", sans-serif;
    }
  </style>

     <style>
          body {
               background-color: #fffaf2;
               background-image:
                    radial-gradient(circle at 8% 12%, rgba(185, 112, 11, 0.16), transparent 40%),
                    radial-gradient(circle at 92% 22%, rgba(10, 61, 31, 0.10), transparent 42%),
                    radial-gradient(circle at 50% 100%, rgba(251, 191, 36, 0.16), transparent 45%),
                    radial-gradient(rgba(10, 61, 31, 0.07) 1px, transparent 1px);
               background-size: auto, auto, auto, 24px 24px;
               background-attachment: fixed;
          }
     </style>
</head>

<body class="flex min-h-screen flex-col font-sans text-gray-700">

     <!-- NAVBAR -->
     <header id="site-header"
          class="sticky top-0 z-50 border-b border-amber-100 bg-white/80 backdrop-blur-md transition-shadow duration-300">
          <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-3">

               <a href="index.html" class="group flex items-center gap-3">
                    <span
                         class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-accent to-amber-500 text-white shadow-md transition duration-300 group-hover:rotate-6">
                         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                              stroke="currentColor" class="h-6 w-6">
                              <path stroke-linecap="round" stroke-linejoin="round"
                                   d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />

                    </span>
                    <span class="text-xl font-extrabold tracking-tight text-brand">Book <span
                              class="text-accent">Treasury</span></span>
               </a>

               <ul class="hidden items-center gap-2 md:flex">
                    <li>
                         <a href="index.html"
                              class="rounded-full px-5 py-2 font-medium text-brand transition-colors duration-300 hover:bg-amber-100 hover:text-accent">Home</a>
                    </li>
                    <li>
                         <a href="favorites.html"
                              class="flex items-center gap-1.5 rounded-full bg-amber-100 px-5 py-2 font-medium text-accent">
                              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                   stroke="currentColor" class="h-5 w-5">
                                   <path stroke-linecap="round" stroke-linejoin="round"

                    <li>
                         <a href="about.html"
                              class="rounded-full px-5 py-2 font-medium text-brand transition-colors duration-300 hover:bg-amber-100 hover:text-accent">About</a>

               </ul>

               <a href="index.html#books"
                    class="hidden items-center gap-2 rounded-full bg-gradient-to-r from-accent to-amber-500 px-6 py-2.5 font-semibold text-white shadow-lg shadow-amber-500/30 transition duration-300 hover:-translate-y-0.5 hover:shadow-xl md:inline-flex">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                         stroke="currentColor" class="h-5 w-5">

                    </svg>
                    Browse Books
               </a>

               <button id="menu-btn" class="rounded-lg p-2 text-brand transition hover:bg-amber-50 md:hidden"
                    aria-label="Toggle menu">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                         stroke="currentColor" class="h-7 w-7">
                         <path stroke-linecap="round" stroke-linejoin="round"
                              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                    </svg>
               </button>
          </nav>

          <ul id="mobile-menu"
               class="hidden space-y-1 border-t border-amber-100 bg-white/95 px-6 py-4 font-medium text-brand md:hidden">
               <li><a href="index.html" class="block rounded-lg px-3 py-2 hover:bg-amber-50">Home</a></li>
               <li><a href="favorites.html" class="block rounded-lg bg-amber-50 px-3 py-2 text-accent">Favorites</a>
               </li>
               <li><a href="about.html" class="block rounded-lg px-3 py-2 hover:bg-amber-50">About</a></li>
               <li><a href="index.html#books"
                         class="mt-2 block rounded-full bg-gradient-to-r from-accent to-amber-500 py-2.5 text-center font-semibold text-white">Browse
                         Books</a></li>

     <!-- FAVORITES -->
     <main class="mx-auto w-full max-w-7xl flex-1 px-6 py-16">

          <div class="mb-10 text-center">
               <p class="text-sm font-semibold uppercase tracking-[0.3em] text-accent">Your Library</p>
               <h1 class="mt-2 text-3xl font-extrabold text-brand md:text-5xl">My Favorites</h1>
               <p id="favorites-count" class="mt-3 text-gray-500"></p>
          </div>

          <!-- Cards are drawn here by js/favorites-page.js -->
          <div id="favorites-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4"></div>
     </main>

     <!-- FOOTER -->
     <footer class="bg-brand text-green-100">
          <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-2 px-6 py-6 text-sm md:flex-row">
               <p>&copy; 2026 Book Treasury. All rights reserved.</p>
               <p class="flex items-center gap-1.5">
                    Made with
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                         class="h-4 w-4 text-red-400">
                         <path
                              d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z" />

     <script type="module" src="js/favorites-page.js"></script>
